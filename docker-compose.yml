# TunePull helper server — ready for a Raspberry Pi (or any always-on machine).
#
#   TUNEPULL_TOKEN='pick-a-long-random-string' docker compose up -d
#
# The image is published for both arm64 (Pi 3/4/5, 64-bit OS) and amd64, so Docker
# picks the right one automatically. No need to build anything on the Pi.
#
# Update to the newest build later with:
#   docker compose pull && docker compose up -d

services:
  tunepull:
    image: blazanmaric/tunepull-server:latest
    container_name: tunepull-server
    restart: unless-stopped
    ports:
      # host:container — change the left side if 8756 is already taken.
      - "8756:8756"
    environment:
      # Set a fixed token so it survives restarts. Change this value!
      # Leave it empty to get a random token printed in the logs instead.
      - TUNEPULL_TOKEN=${TUNEPULL_TOKEN:-change-me-please}
      # Optional: a Netscape cookies.txt exported from a logged-in browser, used to
      # clear YouTube's "Sign in to confirm you're not a bot" wall. Usually you do
      # NOT need this: the extension can send its cookies automatically (Options →
      # YouTube sign-in (cookies)), which is the easy path when Chrome runs on
      # another machine. To use a file instead:
      #   1. put cookies.txt next to this file,
      #   2. uncomment the two lines below (env + volume),
      #   3. add "--cookies", "/cookies/cookies.txt" to the `command` list.
      # - TUNEPULL_COOKIES=/cookies/cookies.txt
    command: ["--token", "${TUNEPULL_TOKEN:-change-me-please}"]
    # Uncomment to pass the cookies file through (see TUNEPULL_COOKIES above).
    # volumes:
    #   - ./cookies.txt:/cookies/cookies.txt:ro
    # yt-dlp + ffmpeg are CPU-heavy; cap the CPU so a job cannot starve the host.
    cpus: 2.0
    # Memory cap. Raspberry Pi OS disables the memory cgroup controller by default,
    # so Docker discards this and prints "Your kernel does not support memory limit
    # capabilities" — harmless, but leave it commented unless you enable it first.
    # To enforce it, add `cgroup_enable=memory cgroup_memory=1` to
    # /boot/firmware/cmdline.txt (older OS: /boot/cmdline.txt), reboot, then uncomment:
    # mem_limit: 1g
